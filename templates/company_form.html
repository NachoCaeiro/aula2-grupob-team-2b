<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit' if company else 'Add' }} Company</title>
</head>
<body>
    <header>
        <h1>{{ 'Edit' if company else 'Add New' }} Company</h1>
        <p><a href="{{ url_for('home') }}">Back to Dashboard</a></p>
    </header>

    <hr>

    <form method="post" action="{{ form_action_url }}">
        <div>
            <label for="name">Company Name:</label>
            <input type="text" id="name" name="name" value="{{ company.name if company else '' }}" required>
        </div>
        <div>
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ company.address if company else '' }}">
        </div>
        <div>
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="{{ company.phone if company else '' }}">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ company.email if company else '' }}" required>
        </div>
        <div>
            <button type="submit">{{ 'Save Changes' if company else 'Add Company' }}</button>
        </div>
    </form>

</body>
</html>
